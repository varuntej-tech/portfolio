<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="30" cy="0" r="1.5" fill="rgba(0, 242, 254, 0.15)" />
    </pattern>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="600" height="360" rx="16" fill="url(#gridPattern)" />

  <!-- Ambient Light Orbs -->
  <circle cx="500" cy="80" r="120" fill="#00f2fe" opacity="0.12" filter="blur(40px)" />
  <circle cx="100" cy="280" r="140" fill="#3b82f6" opacity="0.08" filter="blur(50px)" />

  <!-- Outer Glass Frame -->
  <rect x="20" y="20" width="560" height="320" rx="12" fill="rgba(255, 255, 255, 0.015)" stroke="url(#glowGrad)" stroke-width="1.5" />

  <!-- Tech Header Bar -->
  <rect x="20" y="20" width="560" height="36" rx="12" fill="rgba(15, 23, 42, 0.6)" />
  <circle cx="45" cy="38" r="4" fill="#ef4444" opacity="0.8" />
  <circle cx="62" cy="38" r="4" fill="#f59e0b" opacity="0.8" />
  <circle cx="79" cy="38" r="4" fill="#10b981" opacity="0.8" />
  <text x="550" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.4)" text-anchor="end">SEC_NODE // VT-2026</text>

  <!-- Central Icon Plate -->
  <g transform="translate(300, 150)">
    <circle cx="0" cy="0" r="54" fill="rgba(15, 23, 42, 0.7)" stroke="#00f2fe" stroke-width="2" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="64" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="8 6" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="16" font-family="system-ui, sans-serif" font-size="38" text-anchor="middle">💻</text>
  </g>

  <!-- Tech Circuit Lines -->
  <path d="M 60 150 L 180 150 L 220 180" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.3" />
  <circle cx="60" cy="150" r="3" fill="#00f2fe" />
  <path d="M 540 150 L 420 150 L 380 120" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.3" />
  <circle cx="540" cy="150" r="3" fill="#3b82f6" />

  <!-- Labels -->
  <text x="300" y="260" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="20" fill="url(#textGrad)" text-anchor="middle" letter-spacing="1">TERMINAL WORKSPACE</text>
  <text x="300" y="290" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">Python & Bash Environment</text>
</svg>