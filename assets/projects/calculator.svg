<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0207" />
      <stop offset="50%" stop-color="#19030e" />
      <stop offset="100%" stop-color="#070104" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6226e" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffd4e5" />
      <stop offset="100%" stop-color="#d6226e" />
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <circle cx="30" cy="0" r="1.5" fill="rgba(151, 7, 71, 0.4)" />
    </pattern>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="600" height="360" rx="16" fill="url(#gridPattern)" />

  <!-- Ambient Light Orbs (Dark Pink & White) -->
  <circle cx="500" cy="80" r="130" fill="#d6226e" opacity="0.22" filter="blur(45px)" />
  <circle cx="100" cy="280" r="140" fill="#ffffff" opacity="0.08" filter="blur(50px)" />

  <!-- Outer Glass Frame -->
  <rect x="20" y="20" width="560" height="320" rx="12" fill="rgba(255, 255, 255, 0.02)" stroke="url(#glowGrad)" stroke-width="1.8" />

  <!-- Tech Header Bar -->
  <rect x="20" y="20" width="560" height="36" rx="12" fill="rgba(34, 4, 19, 0.7)" />
  <circle cx="45" cy="38" r="4" fill="#970747" opacity="0.9" />
  <circle cx="62" cy="38" r="4" fill="#d6226e" opacity="0.9" />
  <circle cx="79" cy="38" r="4" fill="#ffffff" opacity="0.9" />
  <text x="550" y="42" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="end">CHAPTER // VT-2026</text>

  <!-- Central Icon Plate -->
  <g transform="translate(300, 150)">
    <circle cx="0" cy="0" r="54" fill="rgba(25, 3, 14, 0.85)" stroke="#d6226e" stroke-width="2.2" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="64" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="16" font-family="system-ui, sans-serif" font-size="38" text-anchor="middle">🔢</text>
  </g>

  <!-- Tech Circuit Lines -->
  <path d="M 60 150 L 180 150 L 220 180" fill="none" stroke="#d6226e" stroke-width="1.5" opacity="0.5" />
  <circle cx="60" cy="150" r="3" fill="#ffffff" />
  <path d="M 540 150 L 420 150 L 380 120" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />
  <circle cx="540" cy="150" r="3" fill="#d6226e" />

  <!-- Labels in White & Dark Pink -->
  <text x="300" y="260" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="700" font-size="20" fill="url(#textGrad)" text-anchor="middle" letter-spacing="1">SCIENTIFIC CALCULATOR</text>
  <text x="300" y="290" font-family="'Inter', system-ui, sans-serif" font-size="13" fill="#fce7f0" text-anchor="middle" letter-spacing="0.5">Tkinter • Math Engine • Expression Parser</text>
</svg>